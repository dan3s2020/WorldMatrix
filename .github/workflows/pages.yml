name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        env: { WORLDMATRIX_DOMAIN: "${{ vars.WORLDMATRIX_DOMAIN }}" }
        run: |
          mkdir _site
          cp -r index.html favicon.svg manifest.webmanifest play arena demos site engine vendor data docs LICENSE _site/
          [ -n "$WORLDMATRIX_DOMAIN" ] && echo "$WORLDMATRIX_DOMAIN" > _site/CNAME || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
