<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>WorldMatrix — 10 games</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <style>
    :root { --m: #00ff9c; --line: rgba(0,255,156,.3); --amber: #ffd166; --mono: "JetBrains Mono", ui-monospace, monospace; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(120% 60% at 50% 0%, #00301b, #000 60%); color: #dcffee; font-family: var(--mono); padding: calc(18px + env(safe-area-inset-top)) 14px 30px; }
    header { text-align: center; margin: 6px 0 18px; }
    h1 { margin: 0; font-size: clamp(26px, 7vw, 40px); letter-spacing: .08em; color: #fff; text-shadow: 0 0 18px rgba(0,255,156,.6); }
    h1 b { color: var(--m); }
    header p { margin: 8px 0 0; color: var(--amber); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; max-width: 900px; margin: 0 auto; }
    a.card { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 16px 10px; border-radius: 20px; border: 1px solid var(--line); background: rgba(0,20,11,.75); color: inherit; text-decoration: none; transition: transform .15s ease, border-color .15s ease; }
    a.card:hover, a.card:active { transform: translateY(-3px) scale(1.02); border-color: var(--m); }
    .card span { font-size: 54px; line-height: 1; }
    .card b { font-size: 15px; color: #fff; }
    .card small { color: #9fcbb6; font-size: 12px; line-height: 1.35; }
    .card i { font-style: normal; font-size: 11px; color: var(--amber); }
    footer { text-align: center; margin-top: 22px; }
    footer a { color: var(--m); }
  </style>
</head>
<body>
  <header>
    <h1>WORLD<b>MATRIX</b></h1>
    <p id="sub">10 games. One mission: keep AI aligned.</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer><a href="../">worldmatrix · open source</a></footer>
  <script type="module" src="./hub.js"></script>
</body>
</html>
